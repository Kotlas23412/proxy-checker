name: Convert JSON to Links and Back

on:
  push:
    paths:
      - '.github/workflows/convert.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

concurrency:
  group: convert-listproxy
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      # Keep this public repository checked out in the workspace root.
      - name: Checkout proxy-checker
        uses: actions/checkout@v4

      # Store the private source/output repository in a separate folder.
      - name: Checkout private listproxy
        uses: actions/checkout@v4
        with:
          repository: Kotlas23412/listproxy
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: listproxy
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Convert configs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlencode, quote

          repo = Path("listproxy")

          def json_to_vless(obj):
              try:
                  outbound = obj["outbounds"][0]
                  server = outbound["settings"]["vnext"][0]
                  user = server["users"][0]
                  stream = outbound["streamSettings"]
                  params = {
                      "type": stream.get("network", "tcp"),
                      "security": stream.get("security", "none"),
                  }
                  if params["security"] == "reality":
                      reality = stream.get("realitySettings", {})
                      params.update({
                          "sni": reality.get("serverName", ""),
                          "pbk": reality.get("publicKey", ""),
                          "sid": reality.get("shortId", ""),
                          "fp": reality.get("fingerprint", "chrome"),
                          "flow": user.get("flow", ""),
                      })
                  query = urlencode({k: v for k, v in params.items() if v})
                  remark = obj.get("remarks", "Unnamed")
                  return f"vless://{user['id']}@{server['address']}:{server['port']}?{query}#{quote(remark)}"
              except (KeyError, IndexError, TypeError):
                  return None

          def process_file(input_name, json_name, links_name):
              input_path = repo / input_name
              if not input_path.is_file():
                  raise FileNotFoundError(f"Required input not found: {input_path}")

              content = input_path.read_text(encoding="utf-8").strip()
              if not content:
                  raise ValueError(f"Input file is empty: {input_path}")

              # Accept either a JSON array/object or adjacent JSON objects.
              try:
                  data = json.loads(content)
                  if isinstance(data, dict):
                      data = [data]
                  elif not isinstance(data, list):
                      raise ValueError(f"Expected JSON object/array in {input_path}")
              except json.JSONDecodeError:
                  fixed = re.sub(r"}\s*{", "},{", content)
                  if not fixed.startswith("["):
                      fixed = "[" + fixed + "]"
                  data = json.loads(fixed)
                  if not isinstance(data, list):
                      raise ValueError(f"Expected JSON array in {input_path}")

              json_path = repo / json_name
              json_path.write_text(
                  json.dumps(data, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )

              links = [link for item in data if isinstance(item, dict)
                       and (link := json_to_vless(item))]
              (repo / links_name).write_text(
                  "\n".join(links) + ("\n" if links else ""),
                  encoding="utf-8",
              )
              print(f"✅ {input_name}: profiles={len(data)}, generated_links={len(links)}")

          process_file("configs.txt", "vless_full.json", "vless_links.txt")
          process_file("configs2.txt", "vless_full2.json", "vless_links2.txt")
          PY

      - name: Commit and push to private listproxy
        shell: bash
        working-directory: listproxy
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add vless_full.json vless_links.txt vless_full2.json vless_links2.txt

          echo "Changes detected in generated files:"
          git diff --cached --stat || true

          if git diff --cached --quiet; then
            echo "Inputs processed successfully. Generated files are unchanged; nothing to push."
            exit 0
          fi

          git commit -m "Update generated VLESS JSON and links"
          git push origin HEAD:main
          echo "✅ Successfully pushed generated files to Kotlas23412/listproxy:main"
